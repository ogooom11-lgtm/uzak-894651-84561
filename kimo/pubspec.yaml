name: win_remote_mobile
version: 1.0.0+1
publish_to: "none"
description: Flutter mobile dashboard for monitoring and controlling authorized Windows devices through Firebase.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  firebase_storage: ^12.3.6
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.2
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/app_icons/
